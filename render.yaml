services:
  - type: web
    runtime: node
    name: travel-planner
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
