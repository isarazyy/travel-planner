# 免费保活：每天定时查询一次 Supabase，制造数据库活动，
# 防止免费版项目因闲置（约一周）被自动暂停，导致登录/保存等功能 fetch failed。
# 用的是公开的 anon key（本就用于浏览器端，无泄密风险）。
name: Supabase Keep-Alive

on:
  schedule:
    # 每天 UTC 03:17（北京时间 11:17）跑一次；错开整点避免 GitHub 调度延迟
    - cron: '17 3 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST + Auth
        env:
          SB_URL: https://okopihgxwjmjikajpzyv.supabase.co
          SB_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rb3BpaGd4d2ptamlrYWpwenl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NDgyOTgsImV4cCI6MjA5MDQyNDI5OH0.JVn4uQcG1asoVnyldYavHR9CCTe5KLNJSKiGtrUbYrI
        run: |
          set -e
          echo "=== REST 查询（制造数据库活动）==="
          REST_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            "$SB_URL/rest/v1/shared-plans?select=id&limit=1" \
            -H "apikey: $SB_ANON" -H "Authorization: Bearer $SB_ANON")
          echo "REST 状态: $REST_CODE"

          echo "=== Auth health ==="
          AUTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            "$SB_URL/auth/v1/health" -H "apikey: $SB_ANON")
          echo "Auth 状态: $AUTH_CODE"

          # 2xx/3xx/4xx 都算项目在线（4xx 说明网关在响应）；只有连不上(000/5xx网关挂)才失败
          case "$REST_CODE" in
            2*|3*|4*) echo "✅ Supabase 在线，保活成功" ;;
            *) echo "❌ Supabase 异常 (REST=$REST_CODE)，可能已暂停或宕机"; exit 1 ;;
          esac
